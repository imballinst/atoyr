services:
  atoyr:
    build:
      context: .
    image: atoyr:latest
    container_name: atoyr
    ports:
      - "80:80"
    env_file:
      - packages/server/.env.production
    environment:
      PORT: 3000
      WORDS_PATH: /app/server/data/words.json
      DATABASE_PATH: /app/server/db/db.sqlite3
      MIGRATIONS_PATH: /app/server/migrations
      STATIC_FILES_PATH: /app/server/web/static
      ENV: production
    volumes:
      - ./packages/server/db:/app/server/db
      - ./packages/server/data:/app/server/data

  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: extend_leaderboard
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d extend_leaderboard"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 5s

volumes:
  postgres_data:
    driver: local
