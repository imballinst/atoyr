<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atoyr - Server Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://accounts.google.com/gsi/client"></script>
  </head>
  <body class="bg-gray-900 text-white min-h-screen">
    <div class="container mx-auto px-4 py-8">
      <div class="flex items-center justify-between mb-8">
        <h1 class="text-3xl font-bold">Atoyr Server Dashboard</h1>
        <div id="gAuth" class="flex items-center gap-3">
          <div id="gSignIn"></div>
          <span id="signedInAs" class="text-sm text-gray-400 hidden"></span>
        </div>
      </div>

      <!-- Scalar Stats Cards -->
      <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-4 mb-8">
        <div class="bg-gray-800 rounded-lg p-4">
          <div class="text-gray-400 text-sm">Sessions Today</div>
          <div id="sessionsToday" class="text-2xl font-bold">-</div>
        </div>
        <div class="bg-gray-800 rounded-lg p-4">
          <div class="text-gray-400 text-sm">Sessions This Week</div>
          <div id="sessionsThisWeek" class="text-2xl font-bold">-</div>
        </div>
        <div class="bg-gray-800 rounded-lg p-4">
          <div class="text-gray-400 text-sm">Sessions This Month</div>
          <div id="sessionsThisMonth" class="text-2xl font-bold">-</div>
        </div>
        <div class="bg-gray-800 rounded-lg p-4">
          <div class="text-gray-400 text-sm">Active Games</div>
          <div id="activeGames" class="text-2xl font-bold">-</div>
        </div>
        <div class="bg-gray-800 rounded-lg p-4">
          <div class="flex items-center justify-between">
            <div class="text-gray-400 text-sm">Total Sessions</div>
            <button
              id="syncTotalSessionsBtn"
              onclick="fetchTotalSessions()"
              title="Compute total session count"
              class="text-gray-400 hover:text-white disabled:opacity-50"
            >
              <svg
                id="syncTotalSessionsIcon"
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                <path d="M3 3v5h5" />
                <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16" />
                <path d="M16 16h5v5" />
              </svg>
            </button>
          </div>
          <div id="totalSessions" class="text-2xl font-bold">-</div>
        </div>
      </div>

      <!-- Time Series Section -->
      <h2 class="text-xl font-semibold mb-4">Time Series</h2>

      <!-- Time Period Selector (only affects charts) -->
      <div class="mb-6 flex gap-2">
        <button
          onclick="setTimePeriod('1h')"
          class="period-btn px-4 py-2 rounded bg-gray-700 hover:bg-gray-600"
          data-period="1h"
        >
          1 Hour
        </button>
        <button
          onclick="setTimePeriod('24h')"
          class="period-btn px-4 py-2 rounded bg-blue-600 hover:bg-blue-500"
          data-period="24h"
        >
          24 Hours
        </button>
        <button
          onclick="setTimePeriod('7d')"
          class="period-btn px-4 py-2 rounded bg-gray-700 hover:bg-gray-600"
          data-period="7d"
        >
          7 Days
        </button>
        <button
          onclick="setTimePeriod('30d')"
          class="period-btn px-4 py-2 rounded bg-gray-700 hover:bg-gray-600"
          data-period="30d"
        >
          30 Days
        </button>
      </div>

      <!-- Time Series Charts -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
        <div class="bg-gray-800 rounded-lg p-4">
          <h3 class="text-lg font-semibold mb-4">Throughput</h3>
          <div class="h-64"><canvas id="throughputChart"></canvas></div>
        </div>
        <div class="bg-gray-800 rounded-lg p-4">
          <h3 class="text-lg font-semibold mb-4">Response Time (ms)</h3>
          <div class="h-64"><canvas id="responseTimeChart"></canvas></div>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="bg-gray-800 rounded-lg p-4">
          <h3 class="text-lg font-semibold mb-4">Error Rate (%)</h3>
          <div class="h-64"><canvas id="errorRateChart"></canvas></div>
        </div>
        <div class="bg-gray-800 rounded-lg p-4">
          <h3 class="text-lg font-semibold mb-4">Memory (MB)</h3>
          <div class="h-64"><canvas id="resourcesChart"></canvas></div>
        </div>
      </div>
    </div>

    <script>
      // Google OAuth configuration
      const GOOGLE_CLIENT_ID =
        "372608753987-bgh0sdcaducma3u7pkvkl23ajehlv9k9.apps.googleusercontent.com";
      let accessToken = null;
      let currentTimePeriod = "24h";

      // Chart instances
      let throughputChart, responseTimeChart, errorRateChart, resourcesChart;

      // Initialize Google Sign-In
      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleCredentialResponse,
      });
      google.accounts.id.renderButton(
        document.getElementById("gSignIn"),
        { theme: "filled_black", size: "medium", text: "signin" },
      );
      google.accounts.id.prompt();

      function handleCredentialResponse(response) {
        accessToken = response.credential;
        try {
          const payload = JSON.parse(
            atob(response.credential.split(".")[1].replace(/-/g, "+").replace(/_/g, "/")),
          );
          const emailEl = document.getElementById("signedInAs");
          emailEl.textContent = "Signed in as " + payload.email;
          emailEl.classList.remove("hidden");
          document.getElementById("gSignIn").classList.add("hidden");
        } catch (e) {
          console.warn("Failed to parse credential payload:", e);
        }
        fetchStats();
        fetchTimeSeries();
      }

      // Set time period (only affects time series charts)
      function setTimePeriod(period) {
        currentTimePeriod = period;

        // Update button styles
        document.querySelectorAll(".period-btn").forEach((btn) => {
          if (btn.dataset.period === period) {
            btn.classList.remove("bg-gray-700");
            btn.classList.add("bg-blue-600");
          } else {
            btn.classList.remove("bg-blue-600");
            btn.classList.add("bg-gray-700");
          }
        });

        fetchTimeSeries();
      }

      // Fetch current stats
      async function fetchStats() {
        if (!accessToken) return;

        const response = await fetch("/api/v1/admin/stats", {
          headers: {
            Authorization: `Bearer ${accessToken}`,
          },
        });

        if (response.ok) {
          const stats = await response.json();
          updateStatsCards(stats);
        }
      }

      // Fetch time series data
      async function fetchTimeSeries() {
        if (!accessToken) return;

        const response = await fetch(
          `/api/v1/admin/timeseries?period=${currentTimePeriod}`,
          {
            headers: {
              Authorization: `Bearer ${accessToken}`,
            },
          },
        );

        if (response.ok) {
          const timeseries = await response.json();
          updateCharts(timeseries);
        }
      }

      // Update stats cards
      function updateStatsCards(stats) {
        document.getElementById("sessionsToday").textContent =
          stats.sessionsToday;
        document.getElementById("sessionsThisWeek").textContent =
          stats.sessionsThisWeek;
        document.getElementById("sessionsThisMonth").textContent =
          stats.sessionsThisMonth;
        document.getElementById("activeGames").textContent = stats.activeGames;
        if (stats.totalSessions != null && stats.totalSessions >= 0) {
          document.getElementById("totalSessions").textContent =
            stats.totalSessions;
        }
      }

      // Fetch total session count (expensive, on demand via the sync button)
      async function fetchTotalSessions() {
        if (!accessToken) return;

        const btn = document.getElementById("syncTotalSessionsBtn");
        const icon = document.getElementById("syncTotalSessionsIcon");
        btn.disabled = true;
        icon.classList.add("animate-spin");

        try {
          const response = await fetch(
            "/api/v1/admin/stats?includeStat=alltimecountsessions",
            {
              headers: {
                Authorization: `Bearer ${accessToken}`,
              },
            },
          );

          if (response.ok) {
            const stats = await response.json();
            updateStatsCards(stats);
          }
        } finally {
          btn.disabled = false;
          icon.classList.remove("animate-spin");
        }
      }

      // Initialize charts
      function initCharts() {
        const chartOptions = {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              labels: { color: "#9CA3AF" },
            },
          },
          scales: {
            x: {
              ticks: { color: "#9CA3AF" },
              grid: { color: "#374151" },
            },
            y: {
              ticks: { color: "#9CA3AF" },
              grid: { color: "#374151" },
            },
          },
        };

        throughputChart = new Chart(
          document.getElementById("throughputChart"),
          {
            type: "line",
            data: {
              labels: [],
              datasets: [
                {
                  label: "Requests",
                  data: [],
                  borderColor: "#3B82F6",
                  tension: 0.4,
                },
              ],
            },
            options: chartOptions,
          },
        );

        responseTimeChart = new Chart(
          document.getElementById("responseTimeChart"),
          {
            type: "line",
            data: {
              labels: [],
              datasets: [
                {
                  label: "P50",
                  data: [],
                  borderColor: "#10B981",
                  tension: 0.4,
                },
                {
                  label: "P95",
                  data: [],
                  borderColor: "#F59E0B",
                  tension: 0.4,
                },
              ],
            },
            options: chartOptions,
          },
        );

        errorRateChart = new Chart(document.getElementById("errorRateChart"), {
          type: "line",
          data: {
            labels: [],
            datasets: [
              {
                label: "Error Rate %",
                data: [],
                borderColor: "#EF4444",
                tension: 0.4,
              },
            ],
          },
          options: chartOptions,
        });

        resourcesChart = new Chart(document.getElementById("resourcesChart"), {
          type: "line",
          data: {
            labels: [],
            datasets: [
              {
                label: "Memory MB",
                data: [],
                borderColor: "#EC4899",
                tension: 0.4,
              },
            ],
          },
          options: chartOptions,
        });
      }

      // Format a point's timestamp according to the granularity returned by the API.
      // For 7d / 30d (granularity "1d"), show the date, otherwise the time of day.
      function formatLabel(timestamp, granularity) {
        const date = new Date(timestamp);
        if (granularity === "1d") {
          return date.toLocaleDateString(undefined, {
            month: "2-digit",
            day: "2-digit",
          });
        }
        return date.toLocaleTimeString(undefined, {
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      // Update charts with time series data
      function updateCharts(timeseries) {
        const granularity = timeseries.granularity || "";
        const labels = timeseries.data.map((d) =>
          formatLabel(d.timestamp, granularity),
        );

        throughputChart.data.labels = labels;
        throughputChart.data.datasets[0].data = timeseries.data.map(
          (d) => d.requestCount,
        );
        throughputChart.update();

        responseTimeChart.data.labels = labels;
        responseTimeChart.data.datasets[0].data = timeseries.data.map(
          (d) => d.responseTimeP50,
        );
        responseTimeChart.data.datasets[1].data = timeseries.data.map(
          (d) => d.responseTimeP95,
        );
        responseTimeChart.update();

        errorRateChart.data.labels = labels;
        errorRateChart.data.datasets[0].data = timeseries.data.map(
          (d) => d.errorRate * 100,
        );
        errorRateChart.update();

        resourcesChart.data.labels = labels;
        resourcesChart.data.datasets[0].data = timeseries.data.map(
          (d) => d.memoryUsage,
        );
        resourcesChart.update();
      }

      // Initialize on load
      document.addEventListener("DOMContentLoaded", initCharts);

      // Poll for updates every 5 seconds
      setInterval(() => {
        fetchStats();
        fetchTimeSeries();
      }, 30_000);
    </script>
  </body>
</html>
