syntax = "proto3";

package atoyr.leaderboard.v1;

option go_package = "extend-leaderboard/pkg/pb/leaderboard/v1;leaderboardv1";

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "Atoyr Extend Leaderboard";
    version: "1.0";
    description: "Leaderboard service for A Test of Your Reflexes (Atoyr). Stores and retrieves player scores, calculates percentiles, and ranks entries per game mode.";
  };
};

service LeaderboardService {
  rpc GetLeaderboard(GetLeaderboardRequest) returns (GetLeaderboardResponse) {
    option (google.api.http) = {
      get: "/v1/leaderboard"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List leaderboard entries";
      description: "Returns a paginated list of ranked leaderboard entries for a given game mode, ordered by score descending.";
    };
  }

  rpc GetPercentile(GetPercentileRequest) returns (GetPercentileResponse) {
    option (google.api.http) = {
      get: "/v1/leaderboard/percentile"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get player percentile";
      description: "Returns the percentile rank of a player within a given game mode, based on score and accuracy.";
    };
  }

  rpc AddSession(AddSessionRequest) returns (AddSessionResponse);

  rpc RemoveSession(RemoveSessionRequest) returns (RemoveSessionResponse);

  rpc UpsertEntry(UpsertEntryRequest) returns (UpsertEntryResponse) {
    option (google.api.http) = {
      post: "/v1/leaderboard/entry"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Upsert a leaderboard entry";
      description: "Creates or updates a player's score entry for a given game mode. If the player already has an entry for that mode, it is overwritten.";
    };
  }
}

message GetLeaderboardRequest {
  string mode = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message LeaderboardEntry {
  int32 rank = 1;
  string user_id = 2;
  int32 score = 3;
  int32 total_attempts = 4;
  double accuracy = 5;
  int64 timestamp = 6;
}

message GetLeaderboardResponse {
  repeated LeaderboardEntry entries = 1;
  int32 total = 2;
}

message GetPercentileRequest {
  string mode = 1;
  string user_id = 2;
}

message GetPercentileResponse {
  double percentile = 1;
}

message AddSessionRequest {
  string session_id = 1;
  string user_id = 2;
  string mode = 3;
  int64 started_at = 4;
}

message AddSessionResponse {}

message RemoveSessionRequest {
  string session_id = 1;
}

message RemoveSessionResponse {}

message UpsertEntryRequest {
  string mode = 1;
  string user_id = 2;
  int32 score = 3;
  int32 total_attempts = 4;
  double accuracy = 5;
  int64 finished_at = 6;
}

message UpsertEntryResponse {}
