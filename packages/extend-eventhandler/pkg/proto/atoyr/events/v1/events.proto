syntax = "proto3";

package atoyr.events.v1;

option go_package = "extend-event-handler/pkg/pb/atoyr/events/v1;eventsv1";

import "google/protobuf/empty.proto";

service AtoyrEventService {
  rpc OnEvent(EventEnvelope) returns (google.protobuf.Empty);
}

message EventEnvelope {
  string event_name = 1;
  bytes payload = 2;
}

message SessionStarted {
  string session_id = 1;
  string user_id = 2;
  string mode = 3;
  int64 started_at = 4;
}

message SessionFinished {
  string session_id = 1;
  string user_id = 2;
  string mode = 3;
  int32 score = 4;
  int32 total_attempts = 5;
  double accuracy = 6;
  int64 finished_at = 7;
}
