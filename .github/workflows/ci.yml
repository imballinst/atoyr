name: ci

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

env:
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.25

      - name: Setup deps
        working-directory: packages/server
        run: ./ci/setup.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
      
      - run: corepack enable

      - name: Install dependencies
        run: yarn

      - name: Test
        run: yarn test && yarn bench

  build:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.COOLIFY_DOCKER_REGISTRY_URL }}
          username: ${{ secrets.COOLIFY_DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.COOLIFY_DOCKER_REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging') }}
          tags: |
            ${{ secrets.COOLIFY_DOCKER_REGISTRY_URL }}/${{ env.IMAGE_NAME }}:${{ github.ref == 'refs/heads/main' && 'latest' || 'staging' }}
            ${{ secrets.COOLIFY_DOCKER_REGISTRY_URL }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_HASH=${{ github.sha }}

  deploy-prod:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Coolify (Production)
        run: |
          curl --request GET '${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}' \
               --header 'Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}'

  deploy-staging:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Coolify (Staging)
        run: |
          curl --request GET '${{ secrets.COOLIFY_STAGING_DEPLOY_WEBHOOK }}' \
               --header 'Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}'
