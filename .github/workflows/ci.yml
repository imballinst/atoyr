name: ci

on:
  push:
    branches: [main, ags-integration]
    tags: ['*.*.*']
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.25

      - name: Setup deps
        working-directory: packages/server
        run: ./ci/setup.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
      
      - run: corepack enable

      - name: Install dependencies
        run: yarn

      - name: Test
        run: yarn test && yarn bench

  build:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.COOLIFY_DOCKER_REGISTRY_URL }}
          username: ${{ secrets.COOLIFY_DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.COOLIFY_DOCKER_REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.COOLIFY_DOCKER_REGISTRY_URL }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=raw,value=staging,enable=${{ github.ref_type == 'branch' }}
            type=raw,value=ags,enable=${{ github.ref_name == 'ags-integration' }}
            type=raw,value=${{ github.sha }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_HASH=${{ github.sha }}

  deploy-staging:
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Staging to Coolify
        run: |
          curl --request GET '${{ secrets.COOLIFY_STAGING_DEPLOY_WEBHOOK }}' \
               --header 'Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}'

  deploy-prod:
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag' && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Production to Coolify
        run: |
          curl --request GET '${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}' \
               --header 'Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}'
