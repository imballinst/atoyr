name: Test & Build

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        go-version: ['1.25']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v4
        with:
          go-version: ${{ matrix.go-version }}

      - name: Setup deps
        working-directory: packages/server
        run: ./ci/setup.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
      
      - name: Install dependencies
        run: yarn

      - name: Test
        run: yarn test


  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'

      - name: Build Go server
        working-directory: packages/server
        run: go build -o bin/server ./cmd

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build client
        run: yarn --cwd packages/client build
