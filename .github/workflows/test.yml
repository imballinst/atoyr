name: Test & Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: TypeScript check (shared)
        run: yarn --cwd packages/shared build

      - name: TypeScript check (server)
        run: yarn --cwd packages/server build

      - name: TypeScript check (client)
        run: yarn --cwd packages/client build

      - name: Run server unit tests
        run: yarn --cwd packages/server test

      - name: Run client tests
        run: yarn --cwd packages/client test

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build shared package
        run: yarn --cwd packages/shared build

      - name: Build server
        run: yarn --cwd packages/server build

      - name: Build client
        run: yarn --cwd packages/client build

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            packages/client/dist
            packages/server/dist
            packages/shared/dist
